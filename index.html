<!doctype html>
<html lang="id"><head><meta charset="utf-8"><title>Cashflow</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: satu kolom HP, kartu saldo di atas, aksi cepat, tumpukan kartu kredit, panel ringkasan; menu pil melayang di bawah */
:root{--bg:#f1f2f4;--surface:#ffffff;--surface2:#eceef2;--hero:#ffffff;--soft:rgba(17,17,20,.05);--seg-on:#ffffff;--line:rgba(17,17,20,.08);
--ink:#111114;--mute:#6b6e78;--faint:#a3a6af;--accent:#3d6fdc;--good:#1d9a60;--bad:#d4515a;
--btn:#111114;--btn-ink:#ffffff;--nav:#111114;--nav-ink:#9a9ca6;--nav-on:#ffffff;--nav-on-ink:#111114;--track:#e2e5ea;
--shadow:0 1px 2px rgba(17,17,20,.04),0 10px 28px rgba(17,17,20,.06);--scrim:rgba(10,10,14,.38);
--font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0b0c;--surface:#17171a;--surface2:#232327;--hero:#232327;--soft:rgba(255,255,255,.07);--seg-on:#3a3a40;--line:rgba(255,255,255,.07);
--ink:#f4f4f6;--mute:#90919b;--faint:#5c5d66;--accent:#86aaff;--good:#5fd39a;--bad:#ff8f96;
--btn:#ffffff;--btn-ink:#0b0b0c;--nav:#1d1d21;--nav-ink:#8f909a;--nav-on:#ffffff;--nav-on-ink:#0b0b0c;--track:#2b2b30;--shadow:none;--scrim:rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b0b0c;--surface:#17171a;--surface2:#232327;--hero:#232327;--soft:rgba(255,255,255,.07);--seg-on:#3a3a40;--line:rgba(255,255,255,.07);
--ink:#f4f4f6;--mute:#90919b;--faint:#5c5d66;--accent:#86aaff;--good:#5fd39a;--bad:#ff8f96;
--btn:#ffffff;--btn-ink:#0b0b0c;--nav:#1d1d21;--nav-ink:#8f909a;--nav-on:#ffffff;--nav-on-ink:#0b0b0c;--track:#2b2b30;--shadow:none;--scrim:rgba(0,0,0,.6);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-weight:600;font-size:15px;min-height:100vh;-webkit-font-smoothing:antialiased}
html,body{touch-action:pan-y pinch-zoom}
main{max-width:480px;margin:0 auto;padding:16px 16px 120px;overflow-x:clip}
button{font:inherit;color:inherit;cursor:pointer}
h1{font-size:26px;font-weight:800;letter-spacing:-.03em;margin:0}
h2{font-size:17px;font-weight:800;letter-spacing:-.01em;margin:0}
.num{font-variant-numeric:tabular-nums}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.hello{min-width:0}.hello b{display:block;font-size:20px;font-weight:800;letter-spacing:-.02em}
.hello small{display:block;color:var(--mute);font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;gap:8px;flex:none}
.rb{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;position:relative;flex:none;color:var(--ink);padding:0}
.rb.pri{background:var(--btn);color:var(--btn-ink);border-color:transparent}
.rb.sm{width:34px;height:34px;background:var(--soft);border-color:transparent}
.badge{position:absolute;top:-3px;right:-3px;min-width:19px;height:19px;border-radius:10px;background:var(--bad);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 5px;border:2px solid var(--bg)}
.panel{background:var(--surface);border-radius:26px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.ph{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:2px 0 16px}
.sh{display:flex;align-items:center;justify-content:space-between;margin:24px 2px 12px}
.lnk{border:0;background:none;color:var(--mute);font-size:13px;font-weight:700;padding:6px 0}
.lbl{font-size:13px;color:var(--mute)}
.val{font-size:26px;font-weight:800;letter-spacing:-.03em;margin-top:2px}
.val.sm{font-size:17px}
.hint{color:var(--mute);font-size:13px;line-height:1.5;margin:4px 0 0}
.sumrow{display:flex;gap:10px;margin-top:14px}.sumrow>div{flex:1;min-width:0}
/* kartu saldo */
.bal{background:var(--hero);border-radius:28px;padding:18px;box-shadow:var(--shadow)}
.bal-top{display:flex;align-items:center;gap:8px}
.bal-top small{flex:1;color:var(--mute);font-size:13px}
.mnav{display:inline-flex;align-items:center;gap:2px;background:var(--soft);border-radius:999px;padding:3px}
.mnav button{border:0;background:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--mute);padding:0}
.mnav span{font-size:13px;font-weight:700;padding:0 4px;text-transform:capitalize;white-space:nowrap}
.mrow{display:flex;justify-content:center;margin-bottom:12px}
.big{font-size:34px;font-weight:800;letter-spacing:-.03em;margin:16px 0 6px}
.flow{display:flex;gap:20px;margin:4px 0 16px;flex-wrap:wrap}
.flow>div{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute)}
.flow b{display:block;color:var(--ink);font-size:15px;font-weight:800}
.dot{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--soft);flex:none}
.dot.g{color:var(--good)}.dot.r{color:var(--bad)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:999px;padding:14px 18px;background:var(--btn);color:var(--btn-ink);font-weight:800;font-size:15px}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.danger{background:none;color:var(--bad)}
.btn.sm{display:inline-flex;width:auto;padding:10px 16px;font-size:13px}
.btn:disabled{opacity:.45}
/* aksi cepat */
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:var(--surface);border-radius:26px;padding:16px 6px;margin-top:14px;box-shadow:var(--shadow)}
.qa button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;color:var(--mute);font-weight:700;padding:0}
.qa i{width:52px;height:52px;border-radius:50%;background:var(--soft);display:grid;place-items:center;color:var(--ink);font-style:normal}
/* kartu kredit */
.deck{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-inline:16px;margin:0 -16px;padding:2px 16px 14px;scrollbar-width:none}
.deck::-webkit-scrollbar{display:none}
.deck .cc{flex:0 0 80%;scroll-snap-align:start}
.cc{position:relative;border:0;border-radius:24px;padding:18px;color:#fff;aspect-ratio:1.62;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;text-align:left;width:100%;box-shadow:0 12px 28px rgba(0,0,0,.2)}
.cc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.cc-top b{font-size:16px;font-weight:800;text-shadow:0 1px 2px rgba(0,0,0,.25);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc-tag{font-size:11px;font-weight:700;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.2);white-space:nowrap;flex:none}
.cc-tag.late{background:rgba(255,110,120,.9)}
.cc-mid small{font-size:12px;opacity:.78}
.cc-amt{font-size:24px;font-weight:800;letter-spacing:-.02em}
.cc-bot{display:flex;justify-content:space-between;font-size:12px;opacity:.88;gap:8px}
.cc.add{background:var(--surface);color:var(--mute);border:1.5px dashed var(--faint);box-shadow:none;flex-direction:row;align-items:center;justify-content:center;gap:8px;font-weight:700}
.stack{display:flex;flex-direction:column;margin-bottom:16px}
.strip{border:0;border-radius:24px 24px 0 0;height:66px;margin-bottom:-24px;padding:13px 18px;color:#fff;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;font-size:14px;text-align:left}
.strip b{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.strip span{opacity:.85;font-size:13px;flex:none}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.acts button{border:0;background:var(--surface);border-radius:20px;padding:14px 4px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--ink);box-shadow:var(--shadow);text-align:center;line-height:1.25}
.acts button:disabled{opacity:.4}
/* progres bersegmen */
.segs{display:flex;height:12px;margin:12px 0 8px}
.segs i{flex:1;border-radius:3px;background:var(--track)}
.segs i.on{background:var(--accent)}
.segs.done i.on,.lbar.done i{background:var(--good)}
.segs.over i.on,.lbar.over i{background:var(--bad)}
.lbar{height:12px;border-radius:6px;background:var(--track);margin:12px 0 8px;overflow:hidden}
.lbar i{display:block;height:100%;background:var(--accent);border-radius:6px}
.meta{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--mute)}
.ihead{display:flex;align-items:center;gap:12px}
.ihead .t{flex:1;min-width:0}.ihead b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ihead small{color:var(--mute);font-size:12px}
.irem{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:16px}
.irem b{font-size:21px;font-weight:800;letter-spacing:-.02em}
.irem span{color:var(--mute);font-size:13px;font-weight:700}
.cheer{font-size:13px;color:var(--mute);margin-top:8px;line-height:1.5}
.bud+.bud{margin-top:18px}
/* daftar */
.item{display:flex;align-items:center;gap:12px;padding:11px 0}
.item+.item,.rk+.rk{border-top:1px solid var(--line)}
.rowbtn{width:100%;border:0;background:none;text-align:left;color:inherit}
.ico{width:42px;height:42px;border-radius:50%;background:var(--soft);display:grid;place-items:center;flex:none;color:var(--ink)}
.item .t{flex:1;min-width:0}.item .t b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item .t small{display:block;color:var(--mute);font-size:12px;margin-top:2px}
.amt{font-weight:800;font-size:15px;white-space:nowrap;font-variant-numeric:tabular-nums}
.amt.in,.pos{color:var(--good)}.amt.out,.neg{color:var(--bad)}
.panel.list{padding-top:6px;padding-bottom:6px}
.rkh{display:flex;flex-direction:column;gap:7px;padding:14px 0}
.rkt{display:flex;justify-content:space-between;gap:10px}
.rkb{display:block;height:8px;border-radius:4px;background:var(--track);overflow:hidden}.rkb i{display:block;height:100%;border-radius:4px}
.rkl{padding-bottom:8px}
.seg{display:flex;background:var(--soft);border-radius:999px;padding:4px;gap:4px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;padding:9px 10px;border-radius:999px;color:var(--mute);font-weight:700;font-size:14px}
.seg button.on{background:var(--seg-on);color:var(--ink);box-shadow:var(--shadow)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 13px;font-size:13px;font-weight:700;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.sheet .chip{background:var(--surface2)}
.chip.on,.sheet .chip.on{background:var(--btn);color:var(--btn-ink);border-color:transparent}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 16px;margin-bottom:12px;color:var(--mute)}
.search input{border:0;background:none;padding:13px 0;border-radius:0}
.search input:focus{border:0}
.pbar{display:flex;gap:4px;height:14px;margin:12px 0 4px}
.pbar i{border-radius:999px;min-width:8px}
.donut{display:flex;align-items:center;gap:16px;margin-top:14px}
.donut svg{width:128px;height:128px;flex:none}
.legend{flex:1;min-width:0;display:grid;gap:9px}
.lg{display:flex;align-items:center;gap:8px;font-size:13px}
.lg i{width:10px;height:10px;border-radius:50%;flex:none}
.lg span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg em{font-style:normal;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}
.empty{text-align:center;color:var(--mute);padding:18px 8px;line-height:1.6;font-size:14px}
/* menu bawah */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:4px;padding:6px;border-radius:999px;background:var(--nav);box-shadow:0 12px 32px rgba(0,0,0,.28);z-index:15}
.nav button{border:0;background:none;height:48px;min-width:52px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--nav-ink);font-weight:800;font-size:14px;padding:0 14px;transition:background-color .2s,color .2s}
.nav button span{display:none}
.nav button.on{background:var(--nav-on);color:var(--nav-on-ink);padding:0 18px}
.nav button.on span{display:inline}
/* lembar form */
.ov{position:fixed;inset:0;background:var(--scrim);display:none;align-items:flex-end;justify-content:center;z-index:20}.ov.on{display:flex}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:480px;max-height:92vh;overflow:auto;border-radius:28px 28px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom,0px));animation:up .28s ease}
.sheet::before{content:"";display:block;width:40px;height:5px;border-radius:3px;background:var(--track);margin:0 auto 14px}
.sheet h2{font-size:20px}
@keyframes up{from{transform:translateY(60px);opacity:0}}
.fl{display:block;font-size:13px;color:var(--mute);margin:14px 0 6px 4px;font-weight:700}
input{width:100%;font:inherit;font-weight:700;font-size:16px;color:var(--ink);background:var(--surface2);border:1.5px solid transparent;border-radius:16px;padding:13px 15px;outline:none}
input:focus{border-color:var(--accent)}
input::placeholder{color:var(--faint)}
.amtin{font-size:26px;font-weight:800}
.err{color:var(--bad);font-size:13px;min-height:20px;margin:8px 4px 0}
.two{display:flex;gap:10px}.two>*{flex:1;min-width:0}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.swb{width:38px;height:38px;border-radius:50%;border:3px solid var(--surface);padding:0;box-shadow:0 0 0 1px var(--line)}
.swb.on{box-shadow:0 0 0 2px var(--ink)}
.swc{position:relative;overflow:hidden;display:block;background:conic-gradient(#ff6b6b,#f7c948,#5fd39a,#5fbfd4,#6b9bff,#a98ff0,#ef8fa6,#ff6b6b)}
.swc input{position:absolute;inset:0;width:100%;height:100%;opacity:0;padding:0;border:0;cursor:pointer}
.ccp{height:56px;border-radius:18px;margin:0 0 12px;cursor:default}
.phv{width:100%;aspect-ratio:1.62;border-radius:18px;background-size:cover;background-position:center;margin:4px 0 10px}
.phrow{display:flex;gap:8px;flex-wrap:wrap}
button:focus-visible,input:focus-visible,label.btn:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));background:var(--btn);color:var(--btn-ink);padding:12px 18px;border-radius:999px;font-size:14px;font-weight:700;z-index:30;display:none;white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast button{border:0;background:none;color:inherit;font-weight:800;margin-left:10px;padding:0;text-decoration:underline}
.car{--pk:40px;position:relative;overflow:hidden;padding:var(--pk) 0;margin:-6px 0 10px;touch-action:none}
.car .sizer{aspect-ratio:1.62;width:100%}
.track{position:absolute;left:0;right:0;top:var(--pk);bottom:var(--pk)}
.slide{position:absolute;inset:0;margin:0;box-shadow:none}
.slide.prev{transform:translateY(calc(-100% - 8px)) scale(.92);transform-origin:center bottom;opacity:.6}
.slide.next{transform:translateY(calc(100% + 8px)) scale(.92);transform-origin:center top;opacity:.6}
.slide.cur{z-index:2}
.dots{display:flex;align-items:center;justify-content:center;gap:7px;margin-bottom:8px}
.dt{width:8px;height:8px;border-radius:4px;border:0;background:var(--track);padding:0;transition:width .2s}
.dt.on{width:22px;background:var(--ink)}
.view{display:none}.view.on{display:block}
@keyframes slFromR{from{transform:translateX(42px);opacity:0}to{transform:none;opacity:1}}@keyframes slFromL{from{transform:translateX(-42px);opacity:0}to{transform:none;opacity:1}}
.view.sl-r{animation:slFromR .22s ease-out}.view.sl-l{animation:slFromL .22s ease-out}
.bounce{animation:bn .6s}@keyframes bn{40%{transform:scale(1.02)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>

const hsh=s=>[...String(s)].reduce((a,c)=>a+c.charCodeAt(0),0);
const nf=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g,'.');
let ym=today().slice(0,7);const month=()=>ym;
const uid=()=>Math.random().toString(36).slice(2,9);
const P={home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/>',card:'<rect x="2" y="5" width="20" height="14" rx="3"/><path d="M2 10h20"/>',
work:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/>',
gift:'<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M5 12v8h14v-8"/>',bag:'<path d="M5 8h14l-1 12H6z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/>',
trend:'<path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/>',dots:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',
food:'<path d="M7 3v8M4 3v5a3 3 0 0 0 6 0V3M7 11v10M17 3c-2 2-3 5-3 8h3v10"/>',bus:'<rect x="4" y="4" width="16" height="13" rx="3"/><path d="M4 11h16M8 21v-4M16 21v-4"/>',

async function pull(){
 if(!cfg.url){sy('Belum tersambung ke Google Sheet');return}
 try{sy('Menyinkronkan…');const r=await fetch(cfg.url+'?key='+encodeURIComponent(cfg.key||''));const j=await r.json();

 else if(j.rev>(S.rev||0)){S={seed:j.seed,tx:j.tx,ins:j.ins,cards:j.cards,bud:j.bud||{},cc:j.cc||{in:[],out:[]},rev:j.rev};store();render();sy('Tersinkron ke Google Sheet')}

function syncSw(){document.querySelectorAll('.swb[data-k]').forEach(b=>b.classList.toggle('on',b.dataset.k===form.col));const c=$('#swc');if(c){c.classList.toggle('on',isHex(form.col));c.style.background=isHex(form.col)?form.col:''}drawCcPrev()}
function drawCcPrev(){const e=$('#ccprev');if(!e)return;const nm=(($('#f_name')||{}).value||'').trim()||'Nama kartu',c={id:form.edit||'baru',col:form.col};e.innerHTML=`<div class="strip ccp" style="${ccBg(c).replace(/background-image:[^;]*;background-size:cover;background-position:center/,'')}"><b>${esc(nm)}</b><span>${form.col?'':'Otomatis'}</span></div>`}
const fmt=e=>e.value=e.value.replace(/\D/g,'').replace(/\B(?=(\d{3})+(?!\d))/g,'.');
function onPhoto(inp){const f=inp.files&&inp.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{const im=new Image();im.onload=()=>{const sc=Math.min(1,720/im.width),cv=document.createElement('canvas');cv.width=Math.round(im.width*sc);cv.height=Math.round(im.height*sc);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);form.photo=cv.toDataURL('image/jpeg',.72);form.photoDel=false;drawPrev()};im.onerror=()=>{$('#err').textContent='Gambar tidak bisa dibuka. Coba pilih foto lain.'};im.src=r.result};r.readAsDataURL(f)}
function drawPrev(){const e=$('#phprev');if(!e)return;const ph=form.photo||(!form.photoDel&&form.edit&&photos[form.edit]);
 e.innerHTML=(ph?`<div class="phv" style="background-image:url(${ph})"></div>`:'')+`<div class="phrow"><label class="btn ghost sm" for="f_photo">${ic('image',16)} ${ph?'Ganti foto':'Pilih foto'}</label>${ph?`<button type="button" class="btn ghost sm" onclick="form.photo=null;form.photoDel=true;drawPrev()">Hapus foto</button>`:''}</div>`}
function drawSheet(){const t=form.type;let f='';
 if(t==='in'||t==='out'){f=`<label class="fl" for="f_amt">Nominal</label><input id="f_amt" class="amtin" inputmode="numeric" placeholder="0" oninput="fmt(this)"><div class="fl">Kategori</div><div class="chips" id="cats">${catList(t).map(c=>`<button type="button" class="chip" data-c="${esc(c[0])}" onclick="pick(this.dataset.c)">${c[1]} ${esc(c[0])}</button>`).join('')}</div><label class="fl" for="f_newcat">Atau buat kategori baru</label><input id="f_newcat" placeholder="Contoh: Hewan peliharaan" maxlength="20">${t==='out'&&!form.payTx&&S.cards.length?viaHTML():''}<label class="fl" for="f_note">Catatan (boleh kosong)</label><input id="f_note" placeholder="Contoh: makan siang" maxlength="40"><label class="fl" for="f_date">Tanggal</label><input id="f_date" type="date" value="${today()}">`}
 else if(t==='ins'){f=`<label class="fl" for="f_name">Nama cicilan</label><input id="f_name" placeholder="Contoh: Motor, HP, Laptop" maxlength="30"><label class="fl" for="f_amt">Cicilan per bulan</label><input id="f_amt" class="amtin" inputmode="numeric" placeholder="0" oninput="fmt(this)"><div class="two"><div><label class="fl" for="f_ten">Lama cicilan (bulan)</label><input id="f_ten" inputmode="numeric" placeholder="12"></div><div><label class="fl" for="f_paid">Sudah dibayar (bulan)</label><input id="f_paid" inputmode="numeric" placeholder="0"></div></div><label class="fl" for="f_day">Tanggal jatuh tempo, berulang tiap bulan (opsional)</label><input id="f_day" type="date">${S.cards.length?viaHTML():''}`}
 else{f=`<label class="fl" for="f_name">Nama kartu</label><input id="f_name" placeholder="Contoh: BCA" maxlength="30"><label class="fl" for="f_amt">Jumlah tagihan</label><input id="f_amt" class="amtin" inputmode="numeric" placeholder="0" oninput="fmt(this)"><div class="two"><div><label class="fl" for="f_pd">Sudah dibayar (Rp)</label><input id="f_pd" inputmode="numeric" placeholder="0" oninput="fmt(this)"></div><div><label class="fl" for="f_l4">4 digit terakhir</label><input id="f_l4" inputmode="numeric" maxlength="4" placeholder="1234" oninput="this.value=this.value.replace(/\\D/g,'').slice(0,4)"></div></div><label class="fl" for="f_date">Tanggal jatuh tempo</label><input id="f_date" type="date" value="${off(7)}">
 <div class="fl">Warna kartu</div><div id="ccprev"></div><div class="sw">${CKEYS.map(k=>`<button type="button" class="swb ${form.col===k?'on':''}" data-k="${k}" style="background:linear-gradient(135deg,${CCOL[k][0]},${CCOL[k][1]})" aria-label="Warna ${CNAME[k]}" onclick="pickCol('${k}')"></button>`).join('')}<label class="swb swc ${isHex(form.col)?'on':''}" id="swc" title="Pilih warna sendiri" style="${isHex(form.col)?'background:'+form.col:''}"><input type="color" id="f_colc" value="${isHex(form.col)?form.col:'#4f7fe0'}" oninput="pickCustom(this.value)" aria-label="Pilih warna sendiri"></label></div><p class="hint">Ketuk lingkaran pelangi di ujung untuk memilih warna sendiri. Kalau tidak ada yang dipilih, warna dipilih otomatis.</p>
 <div class="fl">Foto kartu (opsional, hanya tersimpan di perangkat ini)</div><div id="phprev"></div><input type="file" id="f_photo" accept="image/*" hidden onchange="onPhoto(this)">`}
 const title=form.edit?(t==='ins'?'Edit cicilan':t==='card'?'Edit kartu kredit':'Edit catatan'):'Catat baru',dn=t==='ins'?'cicilan':t==='card'?'kartu':'catatan';
 $('#sheet').innerHTML=`<h2>${title}</h2>${form.edit?'':`<div class="chips" style="margin-top:12px">${TYPES.map(x=>`<button type="button" class="chip ${t===x[0]?'on':''}" onclick="setType('${x[0]}')">${ic(x[1],15)} ${x[2]}</button>`).join('')}</div>`}${f}<div class="err" id="err" role="alert"></div><div class="two" style="margin-top:6px"><button class="btn ghost" onclick="closeSheet()">Batal</button><button class="btn" onclick="submit()">Simpan</button></div>${form.edit?`<button class="btn danger" style="margin-top:8px" onclick="delEdit()">${ic('trash',16)} Hapus ${dn}</button>`:''}`;
 if(t==='card'){drawPrev();drawCcPrev();$('#f_name').addEventListener('input',drawCcPrev)}}
function viaHTML(){return`<div class="fl">${form.type==='ins'?'Dibayar lewat':'Bayar dengan'}</div><div class="chips" id="vias"><button type="button" class="chip ${!form.via?'on':''}" data-v="" onclick="pickVia(this.dataset.v)">${ic('wallet',15)} Saldo</button>${S.cards.map(c=>`<button type="button" class="chip ${form.via===c.id?'on':''}" data-v="${c.id}" onclick="pickVia(this.dataset.v)">${ic('card',15)} ${esc(c.name)}</button>`).join('')}</div><p class="hint" id="viahint" style="margin:-6px 4px 0">${viaHint()}</p>`}
function viaHint(){const c=S.cards.find(x=>x.id===form.via);if(form.type==='ins')return c?'Cicilan ini ikut tagihan '+esc(c.name)+'. Saat ditandai terbayar, saldo tidak berkurang.':'Saat dibayar, nominal cicilan mengurangi saldo.';return c?'Saldo tidak berkurang. Tagihan '+esc(c.name)+' bertambah sebesar nominal ini.':'Nominal ini mengurangi saldo.'}
function pickVia(v){form.via=v;document.querySelectorAll('#vias .chip').forEach(b=>b.classList.toggle('on',b.dataset.v===v));const h=$('#viahint');if(h)h.innerHTML=viaHint()}
function delEdit(){const k={in:'tx',out:'tx',ins:'ins',card:'cards'}[form.type],id=form.edit;closeSheet();del(k,id)}
function openEdit(id){const t=S.tx.find(x=>x.id===id);if(!t)return;form={type:t.type,cat:t.cat,edit:id,via:t.card||'',payTx:!!t.pay};drawSheet();$('#f_amt').value=nf(t.amount);$('#f_note').value=t.note||'';$('#f_date').value=t.date;pick(t.cat);if(!document.querySelector('#cats .chip.on'))$('#f_newcat').value=t.cat;$('#ov').classList.add('on')}
function openEditIns(id){const x=S.ins.find(i=>i.id===id);if(!x)return;form={type:'ins',cat:'',edit:id,via:x.card||''};drawSheet();const n=new Date(),dim=new Date(n.getFullYear(),n.getMonth()+1,0).getDate();$('#f_name').value=x.name;$('#f_amt').value=nf(x.amt);$('#f_ten').value=x.ten;$('#f_paid').value=x.paid;$('#f_day').value=x.day?today().slice(0,7)+'-'+pad(Math.min(x.day,dim)):'';$('#ov').classList.add('on')}
function openEditCard(id){const c=S.cards.find(x=>x.id===id);if(!c)return;form={type:'card',cat:'',edit:id,col:c.col||''};drawSheet();$('#f_name').value=c.name;$('#f_amt').value=nf(c.amt);$('#f_pd').value=c.paidAmt?nf(c.paidAmt):'';$('#f_l4').value=c.l4||'';$('#f_date').value=c.due;drawCcPrev();$('#ov').classList.add('on')}
function submit(){const t=form.type,g=id=>(($('#'+id)||{}).value||''),num=id=>+g(id).replace(/\./g,'')||0,err=m=>{$('#err').textContent=m};let msg='Tersimpan';
 if(t==='in'||t==='out'){const a=num('f_amt'),nc=g('f_newcat').trim(),c=nc||form.cat;if(!a)return err('Isi nominalnya dulu ya.');if(!c)return err('Pilih kategori atau buat yang baru ya.');
  if(nc){S.cc=S.cc||{in:[],out:[]};S.cc[t]=S.cc[t]||[];if(!S.cc[t].includes(nc)&&!CATS[t].some(x=>x[0]===nc))S.cc[t].push(nc)}
  const o={type:t,amount:a,cat:c,note:g('f_note').trim(),date:g('f_date')||today()};ym=o.date.slice(0,7);
  const vc=t==='out'?S.cards.find(x=>x.id===form.via):null;if(vc){o.card=vc.id;o.cn=vc.name}
  if(form.edit){const x=S.tx.find(y=>y.id===form.edit);if(x){txEffect(x,-1);if(!vc){delete x.card;delete x.cn}Object.assign(x,o);txEffect(x,1)}}else{const x={id:uid(),...o};S.tx.push(x);txEffect(x,1)}
  if(vc)msg='Tersimpan. Tagihan '+vc.name+' bertambah '+rp(a);if(tab!=='tx')tab='home'}
 else if(t==='ins'){const n=g('f_name').trim(),a=num('f_amt'),k=num('f_ten'),p=num('f_paid');if(!n)return err('Beri nama cicilannya dulu ya.');if(!a)return err('Isi cicilan per bulan.');if(!k)return err('Isi lama cicilan dalam bulan.');if(p>k)return err('Bulan terbayar tidak boleh lebih dari lama cicilan.');const dv=g('f_day'),dy=dv?+dv.slice(8,10):0;
  const vk=S.cards.some(c=>c.id===form.via)?form.via:'';
  if(form.edit)Object.assign(S.ins.find(x=>x.id===form.edit)||{},{name:n,amt:a,ten:k,paid:p,day:dy,card:vk});else S.ins.push({id:uid(),name:n,amt:a,ten:k,paid:p,day:dy,pm:'',card:vk});tab='ins'}
 else{const n=g('f_name').trim(),a=num('f_amt'),d=g('f_date'),pd=num('f_pd'),l4=g('f_l4').trim();if(!n)return err('Isi nama kartunya dulu ya.');if(!a)return err('Isi jumlah tagihan.');if(!d)return err('Pilih tanggal jatuh tempo.');if(pd>a)return err('Jumlah dibayar tidak boleh lebih dari tagihan.');if(l4&&!/^\d{4}$/.test(l4))return err('4 digit terakhir harus berisi 4 angka.');
  const id=form.edit||uid(),o={name:n,amt:a,due:d,paidAmt:pd,paid:pd>=a,l4,col:form.col||''};
  if(form.edit)Object.assign(S.cards.find(x=>x.id===id)||{},o);else S.cards.push({id,...o});
  if(form.photo){photos[id]=form.photo;if(!savePhotos()){delete photos[id];msg='Tersimpan, tapi foto gagal disimpan karena penyimpanan perangkat penuh'}}
  else if(form.photoDel&&photos[id]){delete photos[id];savePhotos()}
  cardSel=id;tab='card'}
 save();closeSheet();render();toast(msg)}
applyTheme();$('#b-sync').innerHTML=ic('cloud',19);$('#b-bell').insertAdjacentHTML('afterbegin',ic('bell',19));
try{localStorage.removeItem('cashflow-inbox')}catch(e){}
S=load();render();pull();
</script></body></html>
