<!doctype html>
<html lang="id"><head><meta charset="utf-8"><title>Cashflow</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:rgba(255,255,255,.12);--card:rgba(255,255,255,.15);--ink:#fff;--mute:rgba(255,255,255,.72);--pd:#fff;
--mint:rgba(125,211,252,.38);--sky:rgba(96,165,250,.42);--peach:rgba(147,197,253,.3);--lav:rgba(129,140,248,.42);--butter:rgba(186,230,253,.34);--rose:rgba(56,189,248,.4);
--good:#9ff0d6;--bad:#fecdd3;--edge:1px solid rgba(255,255,255,.38);
--clay:0 10px 32px rgba(6,24,90,.28),inset 0 1px 0 rgba(255,255,255,.45);
--clayS:0 4px 14px rgba(6,24,90,.22),inset 0 1px 0 rgba(255,255,255,.4);
--pressed:inset 0 2px 8px rgba(6,24,90,.35);
color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:linear-gradient(150deg,#0b2a6f 0%,#1d4ed8 48%,#38a3e8 100%) fixed;min-height:100%}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(circle at 12% 8%,rgba(125,211,252,.5),transparent 38%),radial-gradient(circle at 90% 38%,rgba(99,102,241,.45),transparent 42%),radial-gradient(circle at 25% 92%,rgba(56,189,248,.4),transparent 40%)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:none;color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;font-weight:600;min-height:100vh}
main{max-width:480px;margin:0 auto;padding:18px 16px 150px}
h1{font-size:26px;font-weight:800;margin:0;letter-spacing:-.03em}h2{font-size:18px;font-weight:800;margin:0 0 12px}
.sub{color:var(--mute);font-size:14px;font-weight:700;text-transform:capitalize}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.glass,.card,.mini,.pill,.chip,.btn,.ico,.logo,.nav,.fab,.sheet,.toast{backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%)}
.logo{width:52px;height:52px;border-radius:20px;background:var(--card);border:var(--edge);box-shadow:var(--clayS);display:grid;place-items:center;font-size:26px}
.card{background:var(--card);border:var(--edge);border-radius:28px;padding:18px;box-shadow:var(--clay);margin-bottom:18px}
.hero{background:linear-gradient(145deg,rgba(255,255,255,.28),rgba(255,255,255,.1))}
.hero .lbl{font-size:14px;opacity:.8}.hero .big{font-size:34px;font-weight:800;margin:2px 0 14px;letter-spacing:-.5px}
.row{display:flex;gap:10px}.row>*{flex:1}
.pill{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);border-radius:20px;padding:10px 12px}
.pill small{display:block;font-size:12px;opacity:.8}.pill b{font-size:15px;font-weight:800}
.mini{border:var(--edge);font:inherit;color:var(--pd);text-align:left;border-radius:24px;padding:14px;cursor:pointer;box-shadow:var(--clay)}
.mini small{display:block;font-size:12px;opacity:.8}.mini b{font-size:17px;font-weight:800;display:block;margin:2px 0}
.mini:active,.btn:active,.chip:active,.nav button:active,.fab:active{box-shadow:var(--pressed)}
.donut{display:flex;gap:14px;align-items:center}.donut svg{width:140px;height:140px;flex:none}
.legend{flex:1;display:grid;gap:7px;min-width:0}.lg{display:flex;align-items:center;gap:7px;font-size:13px}
.lg i{width:12px;height:12px;border-radius:50%;flex:none;border:1px solid rgba(255,255,255,.6)}
.lg span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lg em{font-style:normal;color:var(--mute)}
.empty{text-align:center;color:var(--mute);padding:14px 6px;line-height:1.6;font-size:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid rgba(255,255,255,.28);font:inherit;font-size:14px;color:var(--ink);background:rgba(255,255,255,.12);border-radius:18px;padding:9px 14px;cursor:pointer}
.chip.on{background:rgba(255,255,255,.34);border-color:rgba(255,255,255,.7)}
.item{display:flex;align-items:center;gap:12px;padding:10px 0}
.ico{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;font-size:21px;flex:none;border:1px solid rgba(255,255,255,.35);color:var(--pd)}
.item .t{flex:1;min-width:0}.item .t b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item .t small{color:var(--mute);font-size:12px}
.amt{font-weight:800;font-size:15px;white-space:nowrap}.in{color:var(--good)}.out{color:var(--bad)}
.x{border:0;background:none;color:var(--mute);font-size:18px;padding:6px;cursor:pointer;border-radius:12px}
.btn{border:var(--edge);font:inherit;font-weight:800;color:var(--pd);background:var(--mint);border-radius:20px;padding:12px 16px;box-shadow:var(--clayS);cursor:pointer;width:100%;font-size:15px}
.btn:disabled{opacity:.55;box-shadow:none}.btn.alt{background:var(--lav)}.btn.ghost{background:rgba(255,255,255,.1);color:var(--mute)}
.bar{height:22px;border-radius:14px;background:rgba(6,24,90,.28);box-shadow:var(--pressed);padding:4px;margin:12px 0 8px}
.fill{height:100%;border-radius:10px;background:linear-gradient(90deg,#7dd3fc,#60a5fa);box-shadow:0 0 12px rgba(125,211,252,.6);min-width:12px;transition:width .8s cubic-bezier(.3,1.4,.5,1)}
.fill.mid{background:linear-gradient(90deg,#7dd3fc,#a5b4fc)}.fill.hi{background:linear-gradient(90deg,#a5f3fc,#bae6fd)}
.cheer{font-size:14px;margin-bottom:12px}.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--mute)}
.bounce{animation:bn .6s}@keyframes bn{40%{transform:scale(1.03)}}
.tag{font-size:12px;border-radius:12px;padding:4px 10px;color:var(--pd);display:inline-block;border:1px solid rgba(255,255,255,.3)}
.ic{vertical-align:-3px;flex:none}.ico{background:rgba(255,255,255,.16)!important}.ico svg{width:21px;height:21px}.lg svg{width:14px;height:14px;vertical-align:-2px}.chip svg{width:15px;height:15px;vertical-align:-3px}.pill small svg,.mini small svg{width:13px;height:13px;vertical-align:-2px}.nav button span{display:flex;justify-content:center;margin-bottom:3px}.fab{display:flex;align-items:center;gap:8px}.fab svg{width:18px;height:18px}.logo svg{width:26px;height:26px}
.mn{display:flex;justify-content:space-between;align-items:center;margin:0 0 14px}.mn .x{font-size:26px;line-height:1;padding:2px 14px;color:#fff}.mn b{text-transform:capitalize}
.view{display:none}.view.on{display:block}
.nav-wrap{position:fixed;left:0;right:0;bottom:0;padding:8px 14px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
.nav{max-width:452px;margin:0 auto;background:rgba(255,255,255,.18);border:var(--edge);border-radius:30px;box-shadow:var(--clay);display:flex;padding:8px;gap:4px;pointer-events:auto}
.nav button{flex:1;border:0;font:inherit;font-size:12px;color:var(--mute);background:none;border-radius:22px;padding:8px 0;cursor:pointer}
.nav button span{display:block;font-size:21px}.nav button.on{background:rgba(255,255,255,.26);color:#fff}
.fab{position:fixed;right:max(18px,calc(50% - 222px));bottom:calc(98px + env(safe-area-inset-bottom,0px));border:var(--edge);font:inherit;font-weight:800;font-size:16px;color:#fff;background:linear-gradient(135deg,rgba(255,255,255,.4),rgba(125,211,252,.3));border-radius:26px;padding:15px 22px;box-shadow:var(--clay);cursor:pointer}
.ov{position:fixed;inset:0;background:rgba(5,20,70,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}.ov.on{display:flex}
.sheet{background:linear-gradient(160deg,rgba(30,64,175,.72),rgba(14,60,140,.75));border:var(--edge);width:100%;max-width:480px;max-height:92vh;overflow:auto;border-radius:32px 32px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom,0px));animation:up .3s ease}
@keyframes up{from{transform:translateY(60px);opacity:0}}
label{display:block;font-size:13px;color:var(--mute);margin:14px 0 6px 4px}
input{width:100%;font:inherit;font-weight:800;font-size:16px;color:#fff;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);border-radius:18px;padding:14px 16px;box-shadow:var(--pressed);outline:none}
input::placeholder{color:rgba(255,255,255,.45)}
input:focus-visible,button:focus-visible{outline:3px solid #bae6fd;outline-offset:2px}
.amtin{font-size:26px;font-weight:800}.err{color:#fecdd3;font-size:13px;min-height:20px;margin:8px 4px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(172px + env(safe-area-inset-bottom,0px));background:rgba(8,28,100,.85);border:var(--edge);color:#fff;padding:11px 18px;border-radius:20px;font-size:14px;z-index:30;display:none;white-space:nowrap}
.toast button{border:0;background:none;color:#7dd3fc;font:inherit;font-weight:800;margin-left:10px;cursor:pointer}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<main>
 <div class="top"><div><h1>Cashflow</h1><div class="sub" id="mo"></div><div class="sub" id="sy" style="font-size:12px;text-transform:none;opacity:.85"></div></div><div style="display:flex;gap:10px"><button class="logo" onclick="openSync()" aria-label="Sinkron Google Sheet" style="color:#fff;cursor:pointer;padding:0"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a4 4 0 0 1-.5-7.97A6 6 0 0 1 18 9a4.5 4.5 0 0 1-.5 9z"/></svg></button><div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12V8a2 2 0 0 0-2-2H5a2 2 0 0 1 0-4h12"/><path d="M3 5v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-3"/><path d="M18 12a2 2 0 0 0 0 4h4v-4z"/></svg></div></div></div>
 <section class="view on" id="v-home"></section>
 <section class="view" id="v-tx"></section>
 <section class="view" id="v-ins"></section>
 <section class="view" id="v-card"></section>
</main>
<button class="fab" onclick="openSheet()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Catat</button>
<div class="nav-wrap"><nav class="nav" id="nav"></nav></div>
<div class="ov" id="ov" onclick="if(event.target===this)closeSheet()"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const rp=n=>'Rp\u00a0'+Math.round(n).toLocaleString('id-ID');
const short=n=>n>=1e6?(n/1e6).toFixed(1).replace('.',',')+' jt':n>=1e3?Math.round(n/1e3)+' rb':String(Math.round(n));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ds(new Date());
const off=n=>{const d=new Date();d.setDate(d.getDate()+n);return ds(d)};
let ym=today().slice(0,7);const month=()=>ym;
const uid=()=>Math.random().toString(36).slice(2,9);
const P={wallet:'<path d="M20 12V8a2 2 0 0 0-2-2H5a2 2 0 0 1 0-4h12"/><path d="M3 5v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-3"/><path d="M18 12a2 2 0 0 0 0 4h4v-4z"/>',
home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/>',card:'<rect x="2" y="5" width="20" height="14" rx="3"/><path d="M2 10h20"/>',
down:'<path d="M12 5v14M6 13l6 6 6-6"/>',up:'<path d="M12 19V5M6 11l6-6 6 6"/>',
work:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/>',
gift:'<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M5 12v8h14v-8"/>',bag:'<path d="M5 8h14l-1 12H6z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/>',
trend:'<path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/>',dots:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',
food:'<path d="M7 3v8M4 3v5a3 3 0 0 0 6 0V3M7 11v10M17 3c-2 2-3 5-3 8h3v10"/>',bus:'<rect x="4" y="4" width="16" height="13" rx="3"/><path d="M4 11h16M8 21v-4M16 21v-4"/>',
cart:'<circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/><path d="M2 3h3l3 12h11l2-8H6"/>',play:'<circle cx="12" cy="12" r="9"/><path d="M10 8.5l5 3.5-5 3.5z"/>',
heart:'<path d="M12 20s-8-5-8-11a4.5 4.5 0 0 1 8-2.5A4.5 4.5 0 0 1 20 9c0 6-8 11-8 11z"/>'};
const ic=(n,s=20)=>`<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;
const CATS={
 in:[['Gaji',ic('work'),'#bae6fd'],['Bonus',ic('gift'),'#7dd3fc'],['Usaha',ic('bag'),'#60a5fa'],['Investasi',ic('trend'),'#a5b4fc'],['Lainnya',ic('dots'),'#e0e7ff']],
 out:[['Makan',ic('food'),'#bae6fd'],['Transport',ic('bus'),'#7dd3fc'],['Belanja',ic('cart'),'#38bdf8'],['Rumah',ic('home'),'#60a5fa'],['Hiburan',ic('play'),'#a5b4fc'],['Kesehatan',ic('heart'),'#67e8f9'],['Lainnya',ic('dots'),'#e0e7ff'],['Cicilan',ic('target'),'#818cf8'],['Kartu kredit',ic('card'),'#93c5fd']]};
const MANUAL={in:5,out:7};
const cat=(t,n)=>CATS[t].find(c=>c[0]===n)||['',ic('tag'),'#c7d2fe'];
let S,tab='home',form={type:'out',cat:''},flt='all',undo=null,tt;
function seed(){const d=Math.min(new Date().getDate(),28),m=month();const T=(t,c,a,n,day)=>({id:uid(),type:t,cat:c,amount:a,note:n,date:m+'-'+pad(Math.min(day,d))});
 return{seed:true,
 tx:[T('in','Gaji',8500000,'Gaji bulanan',1),T('in','Usaha',1500000,'Proyek freelance',d),T('out','Rumah',900000,'Listrik & internet',2),T('out','Makan',450000,'Makan mingguan',3),T('out','Makan',320000,'Jajan & kopi',d),T('out','Transport',280000,'Bensin',d),T('out','Belanja',600000,'Kebutuhan bulanan',d),T('out','Hiburan',150000,'Nonton & game',d)],
 ins:[{id:uid(),name:'Laptop kerja',amt:900000,ten:10,paid:8},{id:uid(),name:'Motor',amt:1250000,ten:36,paid:14},{id:uid(),name:'HP baru',amt:458000,ten:12,paid:2}],
 cards:[{id:uid(),name:'Kartu BCA',amt:1850000,due:off(5),paid:false},{id:uid(),name:'Kartu Mandiri',amt:720000,due:off(12),paid:false}]}}
function load(){try{const r=localStorage.getItem('dompetku-v1');if(r)return JSON.parse(r)}catch(e){}return seed()}
let cfg={},pt;
try{cfg=JSON.parse(localStorage.getItem('cashflow-gs'))||{}}catch(e){}
function store(){try{localStorage.setItem('dompetku-v1',JSON.stringify(S))}catch(e){}}
function sy(t){const e=$('#sy');if(e)e.textContent=t}
function save(){S.rev=Date.now();store();push()}
function push(){if(!cfg.url)return;clearTimeout(pt);pt=setTimeout(async()=>{try{sy('Menyimpan…');const r=await fetch(cfg.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({key:cfg.key,state:S,rev:S.rev})});const j=await r.json();sy(j.ok?'Tersinkron ke Google Sheet':'Gagal: '+(j.error||'tidak dikenal'))}catch(e){sy('Gagal sinkron, data tetap aman di perangkat ini')}},600)}
async function pull(){
 if(!cfg.url){sy('Belum tersambung ke Google Sheet');return}
 try{sy('Menyinkronkan…');const r=await fetch(cfg.url+'?key='+encodeURIComponent(cfg.key||''));const j=await r.json();
 if(j.error){sy('Kode rahasia salah');return}
 if(j.empty||(S.rev||0)>j.rev){if(S.seed&&!S.rev){sy('Tersambung ke Google Sheet')}else{if(!S.rev){S.rev=Date.now();store()}push()}}
 else if(j.rev>(S.rev||0)){S={seed:j.seed,tx:j.tx,ins:j.ins,cards:j.cards,bud:j.bud||{},cc:j.cc||{in:[],out:[]},rev:j.rev};store();render();sy('Tersinkron ke Google Sheet')}
 else sy('Tersinkron ke Google Sheet')}catch(e){sy('Offline: data tersimpan di perangkat ini')}}
P.edit='<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>';P.tag='<path d="M20 12l-8 8-9-9V3h8z"/><circle cx="7.5" cy="7.5" r="1"/>';
const catList=t=>CATS[t].slice(0,MANUAL[t]).concat((S.cc&&S.cc[t]||[]).map(n=>[n,ic('tag'),'#c7d2fe']));
function mnav(){const [y,m]=ym.split('-');const l=new Date(y,m-1,1).toLocaleDateString('id-ID',{month:'long',year:'numeric'});return`<div class="mn"><button class="x" onclick="shiftM(-1)" aria-label="Bulan sebelumnya">‹</button><b>${l}</b><button class="x" onclick="shiftM(1)" aria-label="Bulan berikutnya">›</button></div>`}
function shiftM(n){const [y,m]=ym.split('-');ym=ds(new Date(y,m-1+n,1)).slice(0,7);render()}
function openEdit(id){const t=S.tx.find(x=>x.id===id);if(!t)return;form={type:t.type,cat:t.cat,edit:id};drawSheet();$('#f_amt').value=String(t.amount).replace(/\B(?=(\d{3})+(?!\d))/g,'.');$('#f_note').value=t.note||'';$('#f_date').value=t.date;pick(t.cat);$('#ov').classList.add('on')}
function vBud(){const b=S.bud||{},names=Object.keys(b).filter(n=>b[n]>0),by={};
 S.tx.filter(t=>t.type==='out'&&t.date.startsWith(month())).forEach(t=>by[t.cat]=(by[t.cat]||0)+t.amount);
 const rows=names.map(n=>{const sp=by[n]||0,p=Math.min(100,Math.round(sp/b[n]*100)),over=sp>b[n];return`<div style="margin-bottom:14px"><div class="meta" style="color:var(--ink)"><span>${cat('out',n)[1]} ${esc(n)}</span><span>${rp(sp)} / ${rp(b[n])}</span></div><div class="bar" style="height:16px;margin:8px 0 4px;padding:3px"><div class="fill" style="width:${p}%;${over?'background:linear-gradient(90deg,#fda4af,#fb7185);box-shadow:none':''}"></div></div><div class="meta"><span>${over?'Lewat '+rp(sp-b[n]):'Sisa '+rp(b[n]-sp)}</span><span>${p}%</span></div></div>`}).join('');
 return`<div class="card"><h2>Anggaran</h2>${rows||'<div class="empty">Belum ada anggaran. Atur batas pengeluaran per kategori.</div>'}<button class="btn ghost" onclick="openBud()">Atur anggaran</button></div>`}
function openBud(){const b=S.bud||{};$('#sheet').innerHTML=`<h2>Atur anggaran bulanan</h2><div class="sub" style="text-transform:none">Kosongkan kalau tidak ingin dibatasi.</div>${catList('out').map(c=>`<label>${esc(c[0])}</label><input class="bi" data-n="${esc(c[0])}" inputmode="numeric" placeholder="0" value="${b[c[0]]?String(b[c[0]]).replace(/\B(?=(\d{3})+(?!\d))/g,'.'):''}" oninput="fmt(this)">`).join('')}<div class="row" style="margin-top:16px"><button class="btn ghost" onclick="closeSheet()">Batal</button><button class="btn" onclick="saveBud()">Simpan</button></div>`;$('#ov').classList.add('on')}
function saveBud(){const b={};document.querySelectorAll('.bi').forEach(e=>{const v=+e.value.replace(/\./g,'');if(v>0)b[e.dataset.n]=v});S.bud=b;save();closeSheet();render();toast('Anggaran tersimpan ✓')}
function vRem(){const t0=new Date(today()+'T00:00'),L=[];
 S.cards.filter(c=>!c.paid).forEach(c=>{const d=Math.round((new Date(c.due+'T00:00')-t0)/864e5);if(d<=7)L.push([d,c.name,c.amt-(c.paidAmt||0)])});
 S.ins.filter(x=>x.day&&x.paid<x.ten).forEach(x=>{const y=t0.getFullYear(),m=t0.getMonth()+(x.pm===today().slice(0,7)?1:0),dt=new Date(y,m,Math.min(x.day,new Date(y,m+1,0).getDate())),d=Math.round((dt-t0)/864e5);if(d<=7)L.push([d,'Cicilan '+x.name,x.amt])});

 return`<div class="card"><h2>Pengingat</h2>${L.map(([d,n,a])=>`<div class="item" style="padding:6px 0"><div class="ico">${ic('card')}</div><div class="t"><b>${esc(n)}</b><small>${d<0?'Terlambat '+(-d)+' hari':d===0?'Jatuh tempo hari ini':d+' hari lagi'}</small></div><div class="amt">${rp(a)}</div></div>`).join('')}</div>`}
